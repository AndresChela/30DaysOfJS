!DOCTYPE html>
<html>
  <head>
    <title>30DaysOfScript:Inline Script</title>
  </head>
  <body>
    <button onclick="alert('Welcome to 30DaysOfJavaScript!')">Click Me</button>
  </body>
</html>

<!--We can create a pop up alert message using the alert() function-->
<!--When the button is clicked, the alert message will be displayed-->
<!--This is an example of an inline script in HTML.-->
<!--Inline scripts are written directly within HTML elements using event attributes like onclick-->s
